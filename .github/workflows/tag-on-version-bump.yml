name: tag-on-version-bump

# Publishing a version is normally just "bump pyproject.toml's version in
# your PR". When that change lands on main, this tags it as v<version>,
# which in turn triggers release.yml (GitHub Release + CHANGELOG.md) and
# docker.yml (image build/push) -- no separate manual `git tag` step
# needed for the common case.
#
# This only fires when the version *string* actually changed on this
# push; it does nothing on every other commit to main.

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check whether the version changed
        id: version
        run: |
          NEW=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          OLD=""
          if git show HEAD~1:pyproject.toml > /tmp/prev-pyproject.toml 2>/dev/null; then
            OLD=$(grep -m1 '^version = ' /tmp/prev-pyproject.toml | sed -E 's/version = "(.*)"/\1/' || true)
          fi
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ -n "$NEW" ] && [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the version tag
        if: steps.version.outputs.changed == 'true'
        run: |
          TAG="v${{ steps.version.outputs.new }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists -- skipping (this run's pyproject.toml change" \
                 "must already have been tagged)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
