name: release

# Publishing a version: push a tag matching v* (e.g. `git tag v0.1.0-beta &&
# git push origin v0.1.0-beta`). This creates the GitHub Release for you
# with auto-generated notes (commits/PRs merged since the previous tag) --
# no need to hand-write release notes each time.
#
# A tag containing a hyphen (e.g. v0.1.0-beta, following semver's
# pre-release convention) is published as a pre-release; a plain
# vX.Y.Z tag is published as a normal release.

on:
  push:
    tags:
      - "v*"
  # A tag pushed by tag-on-version-bump.yml (using the default GITHUB_TOKEN)
  # does not fire the `push: tags:` trigger above -- GitHub blocks a
  # GITHUB_TOKEN-authored push from cascading into other workflows' event
  # triggers, to prevent recursive runs. That workflow explicitly dispatches
  # this one (`gh workflow run release.yml --ref vX.Y.Z`) instead.
  #
  # A manual run must target `ref: main` (a workflow's `workflow_dispatch`
  # eligibility is checked against its copy of the file AT THE GIVEN REF, not
  # against the default branch -- dispatching against an old tag whose copy
  # predates this trigger being added fails with "Workflow does not have
  # 'workflow_dispatch' trigger"). Since `ref: main` means `github.ref_name`
  # is "main", not the tag to release, the tag must be passed explicitly via
  # this input instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0-beta (must already exist)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG
          gh release view "$TAG" --json body -q .body > /tmp/release-notes.md

      - name: Record the release in CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The tag can be behind main's current tip by the time this runs;
          # commit the changelog entry onto main's actual tip, not the
          # (possibly older) tagged commit.
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          {
            echo "## $TAG - $(date -u +%Y-%m-%d)"
            echo
            cat /tmp/release-notes.md
          } > /tmp/new-entry.md

          if [ -f CHANGELOG.md ]; then
            { head -n 1 CHANGELOG.md; echo; cat /tmp/new-entry.md; echo; tail -n +2 CHANGELOG.md; } > /tmp/CHANGELOG.new
          else
            { echo "# Changelog"; echo; cat /tmp/new-entry.md; } > /tmp/CHANGELOG.new
          fi
          mv /tmp/CHANGELOG.new CHANGELOG.md

          git add CHANGELOG.md
          git commit -m "Update CHANGELOG.md for $TAG"
          git push origin main
