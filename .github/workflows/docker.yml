name: docker

on:
  push:
    tags:
      - "v*"
  # A tag pushed by tag-on-version-bump.yml (using the default GITHUB_TOKEN)
  # does not fire the `push: tags:` trigger above -- GitHub blocks a
  # GITHUB_TOKEN-authored push from cascading into other workflows' event
  # triggers, to prevent recursive runs. That workflow explicitly dispatches
  # this one (`gh workflow run docker.yml --ref vX.Y.Z`) instead.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAGS="$IMAGE:${{ github.ref_name }}"
          # Only move the `latest` tag for real releases, not pre-releases
          # (a tag with a hyphen, e.g. v0.1.0-beta -- same convention as
          # release.yml's pre-release detection).
          if [[ "${{ github.ref_name }}" != *-* ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
