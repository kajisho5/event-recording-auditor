name: docker

on:
  push:
    tags:
      - "v*"
  # A tag pushed by tag-on-version-bump.yml (using the default GITHUB_TOKEN)
  # does not fire the `push: tags:` trigger above -- GitHub blocks a
  # GITHUB_TOKEN-authored push from cascading into other workflows' event
  # triggers, to prevent recursive runs. That workflow explicitly dispatches
  # this one (`gh workflow run docker.yml --ref vX.Y.Z`) instead.
  #
  # A manual run must target `ref: main` (a workflow's `workflow_dispatch`
  # eligibility is checked against its copy of the file AT THE GIVEN REF, not
  # against the default branch -- dispatching against an old tag whose copy
  # predates this trigger being added fails with "Workflow does not have
  # 'workflow_dispatch' trigger"). Since `ref: main` means `github.ref_name`
  # is "main", not the tag to build, the tag must be passed explicitly via
  # this input instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and push, e.g. v0.1.0-beta (must already exist)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          TAGS="$IMAGE:$TAG"
          # Only move the `latest` tag for real releases, not pre-releases
          # (a tag with a hyphen, e.g. v0.1.0-beta -- same convention as
          # release.yml's pre-release detection).
          if [[ "$TAG" != *-* ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
