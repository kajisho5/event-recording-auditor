# Used two ways:
#  1. .github/workflows/pr-autolabel.yml runs this config's `autolabeler`
#     on every PR (opened/reopened/synchronize) to apply fix/feature/chore
#     labels from the PR's title and changed files. "major" is
#     intentionally NOT autolabeled -- see the comment above the
#     `autolabeler` section below for why.
#  2. .github/workflows/release.yml runs release-drafter in dry-run mode
#     (disable-releaser: true) to resolve the next version from those
#     labels on PRs merged since the latest tag, via `version-resolver`
#     below. version-template is deliberately plain MAJOR.MINOR.PATCH --
#     this repo's tags can carry a "-beta" prerelease suffix that
#     .github/scripts/resolve_version.py re-applies itself, not
#     release-drafter's own version-resolver.

name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
version-template: "$MAJOR.$MINOR.$PATCH"

# Every release this project has published so far is a "-beta" GitHub
# pre-release. release-drafter's dry run otherwise only looks at
# non-prerelease GitHub Releases to find "the previous release" to diff
# against -- with none existing, it silently resolves nothing (confirmed
# live: v0.1.1-beta -> a merge with a "fix"-labeled PR still produced an
# empty resolved_version and .github/workflows/release.yml correctly
# skipped, per its own logs, rather than releasing something wrong).
include-pre-releases: true

categories:
  - title: "Breaking changes"
    labels: ["major"]
  - title: "Features"
    labels: ["feature", "enhancement"]
  - title: "Fixes"
    labels: ["fix", "bug"]
  - title: "Maintenance"
    labels: ["chore", "dependencies", "github_actions"]

change-template: "- $TITLE (#$NUMBER)"

version-resolver:
  major:
    labels: ["major"]
  minor:
    labels: ["feature", "enhancement"]
  patch:
    labels: ["fix", "bug", "chore", "dependencies", "github_actions"]
  default: patch

# Matched against this repo's actual PR title convention: plain imperative
# sentences (no conventional-commit prefixes), e.g. "Fix workflow_dispatch
# on release.yml...", "Add regression test for...", "Bump version to...".
#
# Deliberately no "major" rule here. A text-pattern autolabeler rule that
# applies "major" from a PR's title/body (e.g. matching "breaking:" or a
# "BREAKING CHANGE" mention anywhere in the description) auto-bumps the
# next version to a new major release the moment that PR merges, with no
# human decision in the loop -- a real incident in another repo
# (color-grading-skill) had a bug-description paragraph that merely
# mentioned the words "BREAKING CHANGE" get auto-labeled "major", which
# would have shipped an unintended vX.0.0 had it merged at the wrong
# moment. version-resolver.major above still maps the "major" label to a
# major bump -- that's fine and intentional -- but the label itself must
# only ever be applied by a human, deliberately, never by text-pattern
# matching. Do not re-add a title/body-pattern rule for "major" here.
autolabeler:
  - label: "fix"
    title:
      - "/^fix[:\\s]/i"
  - label: "feature"
    title:
      - "/^(add|implement|create)[:\\s]/i"
  - label: "chore"
    title:
      - "/^(bump|update|remove|polish|make|rename|refactor|clean\\s?up)[:\\s]/i"
    files:
      - ".github/**"
      - "*.md"
      - "docs/**"

template: |
  ## What's Changed

  $CHANGES
