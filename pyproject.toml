[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-recording-auditor"
version = "0.1.1-beta"
description = "Evidence-first, deterministic anomaly detection for recorded event footage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Only needed for the experimental feedback/howling detector's windowed
# FFT (see docs/architecture.md "Dependencies" and
# src/event_recording_auditor/detectors/feedback.py). Everything else in
# this project depends on the ffmpeg/ffprobe binaries plus the Python
# standard library.
feedback = ["numpy>=1.24"]
dev = ["pytest>=7.4", "numpy>=1.24", "ruff>=0.6"]

[project.scripts]
event-recording-auditor = "event_recording_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long ffmpeg filter-graph strings and HTML template literals read worse
# split across lines than left as one long line.
"examples/generate_synthetic_fixtures.py" = ["E501"]
"src/event_recording_auditor/reporting/html_report.py" = ["E501"]
